name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A few details help with the diagnosis:
        the window backend, the Brave version and the distribution.
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe the expected and the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Linux Mint 22.3, Cinnamon 6.4, Brave 1.7x, backend x11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      render: shell
