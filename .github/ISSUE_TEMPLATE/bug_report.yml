name: Reporte de error
description: Informar de un problema reproducible
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por el reporte. Un par de datos ayudan a diagnosticar:
        el backend de ventanas, la version de Brave y la distribucion.
  - type: textarea
    id: que-pasa
    attributes:
      label: Que ocurre
      description: Describe el comportamiento esperado y el observado.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: "Linux Mint 22.3, Cinnamon 6.4, Brave 1.7x, backend x11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Salida de la terminal
      render: shell
