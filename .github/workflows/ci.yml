name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas en Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Ejecutar las pruebas
        run: pytest -q --cov=brave_workspace_manager --cov-report=term-missing

      - name: Comprobar que el paquete se puede construir
        run: |
          pip install build
          python -m build

  revision:
    name: Revision de estilo
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Comprobar formato y lint
        run: |
          ruff check brave_workspace_manager tests
          ruff format --check brave_workspace_manager tests
